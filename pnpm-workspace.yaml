packages:
  - packages/*
  - packages/prisma-orm/*
  - apps/*
  - tests/*

allowBuilds:
  "@prisma/engines": true
  "@prisma/client": true
  "@tailwindcss/oxide": true
  core-js: true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  msgpackr-extract: false
  workerd: false

minimumReleaseAgeExclude:
  - undici@7.28.0
  - js-yaml@4.1.2
  - sharp@0.35.0
  - cookie@0.7.0
  - fast-uri@3.1.5
  - hono@4.12.34
  - mermaid@11.16.1
  - js-yaml@4.3.1
  - dompurify@3.4.13
  - nanoid@3.3.17
  - "@prisma/orm-family-sql@8.0.0-rc.5"
  - "@prisma/orm-framework@8.0.0-rc.5"
  - "@prisma/orm-postgres@8.0.0-rc.5"
  - "@prisma/orm-target-postgres@8.0.0-rc.5"
  - "@prisma/orm-toolchain@8.0.0-rc.5"

peerDependencyRules:
  allowedVersions:
    tailwindcss: "4"
    vite: "8"
    workbox-build: "7.4.0"

overrides:
  "@hono/node-server@<1.19.13": ">=1.19.13"
  "@types/node": "^24.10.9"
  cookie@<0.7.0: ^0.7.0
  deepmerge-ts@<8.0.0: ^8.0.0
  defu@<=6.1.4: ">=6.1.5"
  "devalue@<5.6.4": ">=5.6.4"
  drizzle-orm@<0.45.2: ">=0.45.2"
  effect@<3.20.0: ">=3.20.0"
  "hono@<4.12.7": ">=4.12.7"
  js-yaml@<=4.1.1: ^4.1.2
  "js-yaml@>=4.0.0 <=4.1.1": "^4.1.2"
  kysely@<=0.28.13: ">=0.28.14"
  lodash-es@<=4.17.23: ">=4.18.0"
  lodash@<=4.17.23: ">=4.18.0"
  mysql2@<3.22.0: ^3.22.0
  mysql2@<=3.23.0: ^3.23.1
  postcss@<8.5.10: ^8.5.10
  qs@>=2.2.5 <6.16.0: ^6.16.0
  qs@>=6.14.2 <=6.15.3: ^6.16.0
  read-yaml-file: ^2.1.0
  "serialize-javascript@<=7.0.2": ">=7.0.3"
  sharp@<0.35.0: ^0.35.0
  tmp@<=0.2.3: ">=0.2.4"
