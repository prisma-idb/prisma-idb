name: Benchmark Regression

# Two suites share one pipeline (see the `suite` matrix below):
# - generator:  apps/benchmark, the old code generator's client.
# - prisma-orm: apps/prisma-orm-benchmark, the @prisma-idb/client-idb ORM.
# Both use @prisma-idb/benchmark-kit for the runner, the bootstrap-CI
# comparison and the PR comment. The suites share one PR comment, which the
# `publish-benchmark-pr-comment` job assembles from their reports.
#
# A PR is compared against its base in the order head, base, base, head. One
# run per tree in a fixed order measured whichever ran first as slower, even
# on PRs that change nothing a benchmark touches. The two runs of each tree
# are pooled.

on:
  push:
    branches: [main]
    paths:
      - "apps/benchmark/**"
      - "apps/prisma-orm-benchmark/**"
      - "packages/benchmark-kit/**"
      - "packages/generator/**"
      - "packages/prisma-orm/**"
      - "scripts/benchmark-local.sh"
      - ".github/workflows/benchmark.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/benchmark/**"
      - "apps/prisma-orm-benchmark/**"
      - "packages/benchmark-kit/**"
      - "packages/generator/**"
      - "packages/prisma-orm/**"
      - "scripts/benchmark-local.sh"
      - ".github/workflows/benchmark.yml"

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  BENCHMARK_WARMUP_RUNS: "2"
  BENCHMARK_MEASURED_RUNS: "30"

jobs:
  benchmark-pr-compare:
    if: github.event_name == 'pull_request'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - id: generator
            title: generator client
            dir: apps/benchmark
            # The generated client is gitignored, so it's regenerated per checkout.
            prepare: pnpm generate
            dataset-size: "1000"
          - id: prisma-orm
            title: prisma-orm client
            dir: apps/prisma-orm-benchmark
            # The app consumes the built dist/ of the workspace packages.
            prepare: pnpm turbo run build --filter=@prisma-idb/prisma-orm-benchmark^...
            # Large enough that a full scan costs clearly more than the
            # gate's 5ms absolute floor.
            dataset-size: "5000"

    env:
      BENCHMARK_DATASET_SIZE: ${{ matrix.suite.dataset-size }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      # The runner context isn't available in job-level env.
      - name: Set results directory
        run: echo "RESULTS_DIR=$RUNNER_TEMP/benchmark-results" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browser
        working-directory: ${{ matrix.suite.dir }}
        # The apt/CDN download occasionally hangs on a runner; cap each attempt and retry once.
        run: |
          timeout 600 pnpm exec playwright install chromium \
            || timeout 600 pnpm exec playwright install chromium

      - name: Prepare benchmark app (PR head)
        working-directory: ${{ matrix.suite.dir }}
        run: ${{ matrix.suite.prepare }}
        env:
          DATABASE_URL: "postgresql://placeholder@localhost:5432/placeholder"

      - name: Run benchmark suite (PR head)
        working-directory: ${{ matrix.suite.dir }}
        env:
          BENCHMARK_RESULT_PATH: ${{ runner.temp }}/benchmark-results/current-1.json
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
          NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
        run: |
          mkdir -p "$RESULTS_DIR"
          pnpm benchmark:ci

      - name: Save HEAD chromium directory
        run: |
          HEAD_CHROMIUM=$(ls ~/.cache/ms-playwright | grep '^chromium_headless_shell-' | head -1)
          echo "HEAD_CHROMIUM=$HEAD_CHROMIUM" >> $GITHUB_ENV

      - name: Checkout PR base
        run: git checkout --force ${{ github.event.pull_request.base.sha }}

      # A PR that introduces a suite has nothing to compare against on base.
      # Its comparison is then advisory instead of failing.
      - name: Check the suite exists on base
        id: base
        run: |
          if [ -f "${{ matrix.suite.dir }}/package.json" ]; then
            echo "has-suite=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-suite=false" >> "$GITHUB_OUTPUT"
            echo "PR base has no ${{ matrix.suite.dir }}; skipping the base run."
          fi

      - name: Install base dependencies
        if: steps.base.outputs.has-suite == 'true'
        # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 prevents playwright 1.x postinstall hooks
        # from running, which would otherwise delete HEAD's chromium revision as "unused".
        #
        # node_modules is wiped first: `pnpm install --frozen-lockfile` reinstalling
        # in-place over a checkout whose workspace *membership* changed (packages/apps
        # renamed, added, or removed vs HEAD) can leave stale resolution state that
        # doesn't match either lockfile — reproduced by hand, e.g. as spurious
        # implicit-any errors from a correctly-linked but misresolved type package.
        # A full wipe forces pnpm to relink from its content-addressable store clean.
        run: |
          find . -name node_modules -type d -prune -exec rm -rf {} +
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 pnpm install --frozen-lockfile

      - name: Ensure Playwright browser is available for base
        if: steps.base.outputs.has-suite == 'true'
        working-directory: ${{ matrix.suite.dir }}
        # HEAD's browser is still intact (PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD prevented deletion).
        # If base needs a different revision, symlink HEAD's binary — same chromium engine,
        # close enough for benchmark comparison purposes.
        run: |
          BROWSER_DIR=$(pnpm exec playwright install --dry-run chromium 2>&1 \
            | awk '/Install location:.*chromium_headless_shell/{print $NF}' | head -1)
          echo "Base playwright needs: $BROWSER_DIR"

          if [ -d "$BROWSER_DIR" ]; then
            echo "Already present — skipping."
          else
            echo "Different revision. Symlinking HEAD chromium ($HEAD_CHROMIUM)..."
            mkdir -p "$(dirname "$BROWSER_DIR")"
            ln -sf "$HOME/.cache/ms-playwright/$HEAD_CHROMIUM" "$BROWSER_DIR"
            echo "Symlinked: $HEAD_CHROMIUM -> $BROWSER_DIR"
          fi

      - name: Prepare benchmark app (PR base)
        if: steps.base.outputs.has-suite == 'true'
        working-directory: ${{ matrix.suite.dir }}
        run: ${{ matrix.suite.prepare }}
        env:
          DATABASE_URL: "postgresql://placeholder@localhost:5432/placeholder"

      - name: Run benchmark suite (PR base)
        if: steps.base.outputs.has-suite == 'true'
        working-directory: ${{ matrix.suite.dir }}
        env:
          BENCHMARK_RESULT_PATH: ${{ runner.temp }}/benchmark-results/baseline-1.json
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
          NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
        run: pnpm benchmark:ci

      - name: Run benchmark suite again (PR base)
        if: steps.base.outputs.has-suite == 'true'
        working-directory: ${{ matrix.suite.dir }}
        env:
          BENCHMARK_RESULT_PATH: ${{ runner.temp }}/benchmark-results/baseline-2.json
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
          NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
        run: pnpm benchmark:ci

      - name: Restore PR head
        run: |
          git checkout --force ${{ github.sha }}
          find . -name node_modules -type d -prune -exec rm -rf {} +
          pnpm install --frozen-lockfile

      - name: Prepare benchmark app (PR head, again)
        if: steps.base.outputs.has-suite == 'true'
        working-directory: ${{ matrix.suite.dir }}
        run: ${{ matrix.suite.prepare }}
        env:
          DATABASE_URL: "postgresql://placeholder@localhost:5432/placeholder"

      - name: Run benchmark suite again (PR head)
        if: steps.base.outputs.has-suite == 'true'
        working-directory: ${{ matrix.suite.dir }}
        env:
          BENCHMARK_RESULT_PATH: ${{ runner.temp }}/benchmark-results/current-2.json
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
          NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
        run: pnpm benchmark:ci

      - name: Compare benchmarks
        if: steps.base.outputs.has-suite == 'true'
        working-directory: ${{ matrix.suite.dir }}
        run: |
          pnpm benchmark:compare \
            --baseline "$RESULTS_DIR/baseline-1.json,$RESULTS_DIR/baseline-2.json" \
            --current "$RESULTS_DIR/current-1.json,$RESULTS_DIR/current-2.json" \
            --threshold 10 \
            --title "${{ matrix.suite.title }}" \
            --json-out "$RESULTS_DIR/report.json" \
            --markdown-out "$RESULTS_DIR/report.md"

      - name: Write advisory report (no baseline)
        if: steps.base.outputs.has-suite != 'true'
        run: |
          NOTICE="The PR base has no ${{ matrix.suite.dir }}, so there is no baseline to compare against."
          jq -n --arg notice "$NOTICE" '{isAdvisory: true, shouldFail: false, notices: [$notice]}' > "$RESULTS_DIR/report.json"
          {
            echo "<details>"
            echo "<summary><b>${{ matrix.suite.title }}</b>: ℹ️ advisory</summary>"
            echo
            echo "> [!NOTE]"
            echo "> $NOTICE This run's results are in the workflow artifacts."
            echo
            echo "</details>"
          } > "$RESULTS_DIR/report.md"

      - name: Enforce benchmark regression gate
        run: |
          jq -r '(.notices[]? | "Notice: " + .)' "$RESULTS_DIR/report.json"
          if [ "$(jq -r '.shouldFail' "$RESULTS_DIR/report.json")" = "true" ]; then
            echo "Benchmark regression gate failed." >&2
            exit 1
          fi

      - name: Upload benchmark artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results-${{ matrix.suite.id }}
          path: ${{ runner.temp }}/benchmark-results/
          retention-days: 30

  # One comment for both suites: the matrix legs each upload a report, and this
  # job joins them. It runs even when a leg failed, since a failing gate is
  # what the comment is for.
  publish-benchmark-pr-comment:
    needs: benchmark-pr-compare
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install benchmark-kit dependencies
        run: pnpm install --frozen-lockfile --filter @prisma-idb/benchmark-kit

      - name: Download suite reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: benchmark-results-*
          path: ${{ runner.temp }}/downloaded

      - name: Assemble comment
        run: |
          {
            echo "## Benchmark regression report"
            echo
            for suite in generator prisma-orm; do
              REPORT="$RUNNER_TEMP/downloaded/benchmark-results-$suite/report.md"
              if [ -f "$REPORT" ]; then
                cat "$REPORT"
              else
                echo "- ⚠️ **$suite client**: no report was produced, see the workflow run."
              fi
              echo
            done
            echo "<sub>[Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)</sub>"
          } > "$RUNNER_TEMP/comment.md"

      - name: Publish benchmark PR comment
        working-directory: packages/benchmark-kit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec tsx src/cli/publish-benchmark-pr-comment.ts --body-file "$RUNNER_TEMP/comment.md"

  run-main-benchmark:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - id: generator
            dir: apps/benchmark
            prepare: pnpm generate
            dataset-size: "1000"
          - id: prisma-orm
            dir: apps/prisma-orm-benchmark
            prepare: pnpm turbo run build --filter=@prisma-idb/prisma-orm-benchmark^...
            dataset-size: "5000"

    env:
      BENCHMARK_DATASET_SIZE: ${{ matrix.suite.dataset-size }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      # The runner context isn't available in job-level env.
      - name: Set results directory
        run: echo "RESULTS_DIR=$RUNNER_TEMP/benchmark-results" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browser
        working-directory: ${{ matrix.suite.dir }}
        # The apt/CDN download occasionally hangs on a runner; cap each attempt and retry once.
        run: |
          timeout 600 pnpm exec playwright install chromium \
            || timeout 600 pnpm exec playwright install chromium

      - name: Prepare benchmark app
        working-directory: ${{ matrix.suite.dir }}
        run: ${{ matrix.suite.prepare }}
        env:
          DATABASE_URL: "postgresql://placeholder@localhost:5432/placeholder"

      - name: Run benchmark suite
        working-directory: ${{ matrix.suite.dir }}
        env:
          BENCHMARK_RESULT_PATH: ${{ runner.temp }}/benchmark-results/main-current.json
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
          NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
        run: |
          mkdir -p "$RESULTS_DIR"
          pnpm benchmark:ci

      - name: Upload benchmark artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results-main-${{ matrix.suite.id }}
          path: ${{ runner.temp }}/benchmark-results/
          retention-days: 30

  # One publish for both suites: the branch is force-replaced on every
  # publish, so separate publishes would delete each other's snapshot.
  publish-main-benchmark-snapshot:
    needs: run-main-benchmark
    # Runs even if the prisma-orm leg failed, so the docs site's snapshot
    # still updates. `!cancelled()` also overrides the skip inherited from
    # `needs`, so the push-to-main condition is repeated here. The generator
    # snapshot is required: without it the force-replaced branch would lose
    # latest.json.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download suite results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: benchmark-results-main-*
          path: ${{ runner.temp }}/downloaded

      - name: Prepare public benchmark snapshot
        # The docs site reads the generator suite from latest.json.
        run: |
          OUT="$RUNNER_TEMP/benchmark-public"
          mkdir -p "$OUT/prisma-orm"
          cp "$RUNNER_TEMP/downloaded/benchmark-results-main-generator/main-current.json" "$OUT/latest.json"
          PRISMA_ORM="$RUNNER_TEMP/downloaded/benchmark-results-main-prisma-orm/main-current.json"
          if [ -f "$PRISMA_ORM" ]; then
            cp "$PRISMA_ORM" "$OUT/prisma-orm/latest.json"
          else
            echo "::warning::No prisma-orm benchmark result; publishing the generator snapshot only."
          fi

      - name: Publish public benchmark snapshot
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: benchmark-data
          publish_dir: ${{ runner.temp }}/benchmark-public
          force_orphan: true
          enable_jekyll: false
          commit_message: "chore(benchmark): publish latest benchmark snapshot [skip ci]"
