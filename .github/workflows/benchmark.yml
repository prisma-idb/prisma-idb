name: Benchmark Regression

on:
  push:
    branches: [main]
    paths:
      - "apps/benchmark/**"
      - "packages/generator/**"
      - "scripts/benchmark-local.sh"
      - ".github/workflows/benchmark.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/benchmark/**"
      - "packages/generator/**"
      - "scripts/benchmark-local.sh"
      - ".github/workflows/benchmark.yml"

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  BENCHMARK_DATASET_SIZE: "1000"
  BENCHMARK_WARMUP_RUNS: "2"
  BENCHMARK_MEASURED_RUNS: "30"

jobs:
  benchmark-pr-compare:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browser
        working-directory: apps/benchmark
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate benchmark clients (PR head)
        working-directory: apps/benchmark
        run: pnpm generate
        env:
          DATABASE_URL: "postgresql://placeholder@localhost:5432/placeholder"

      - name: Run benchmark suite (PR head)
        working-directory: apps/benchmark
        env:
          BENCHMARK_DATASET_SIZE: ${{ env.BENCHMARK_DATASET_SIZE }}
          BENCHMARK_WARMUP_RUNS: ${{ env.BENCHMARK_WARMUP_RUNS }}
          BENCHMARK_MEASURED_RUNS: ${{ env.BENCHMARK_MEASURED_RUNS }}
          BENCHMARK_RESULT_PATH: ${{ runner.temp }}/benchmark-results/current.json
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
          NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
        run: |
          mkdir -p "$RUNNER_TEMP/benchmark-results"
          pnpm benchmark:ci

      - name: Save HEAD chromium directory
        run: |
          HEAD_CHROMIUM=$(ls ~/.cache/ms-playwright | grep '^chromium_headless_shell-' | head -1)
          echo "HEAD_CHROMIUM=$HEAD_CHROMIUM" >> $GITHUB_ENV

      - name: Checkout PR base
        run: git checkout --force ${{ github.event.pull_request.base.sha }}

      - name: Install base dependencies
        # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 prevents playwright 1.x postinstall hooks
        # from running, which would otherwise delete HEAD's chromium revision as "unused".
        #
        # node_modules is wiped first: `pnpm install --frozen-lockfile` reinstalling
        # in-place over a checkout whose workspace *membership* changed (packages/apps
        # renamed, added, or removed vs HEAD) can leave stale resolution state that
        # doesn't match either lockfile — reproduced by hand, e.g. as spurious
        # implicit-any errors from a correctly-linked but misresolved type package.
        # A full wipe forces pnpm to relink from its content-addressable store clean.
        run: |
          find . -name node_modules -type d -prune -exec rm -rf {} +
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 pnpm install --frozen-lockfile

      - name: Ensure Playwright browser is available for base
        working-directory: apps/benchmark
        # HEAD's browser is still intact (PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD prevented deletion).
        # If base needs a different revision, symlink HEAD's binary — same chromium engine,
        # close enough for benchmark comparison purposes.
        run: |
          BROWSER_DIR=$(pnpm exec playwright install --dry-run chromium 2>&1 \
            | awk '/Install location:.*chromium_headless_shell/{print $NF}' | head -1)
          echo "Base playwright needs: $BROWSER_DIR"

          if [ -d "$BROWSER_DIR" ]; then
            echo "Already present — skipping."
          else
            echo "Different revision. Symlinking HEAD chromium ($HEAD_CHROMIUM)..."
            mkdir -p "$(dirname "$BROWSER_DIR")"
            ln -sf "$HOME/.cache/ms-playwright/$HEAD_CHROMIUM" "$BROWSER_DIR"
            echo "Symlinked: $HEAD_CHROMIUM -> $BROWSER_DIR"
          fi

      - name: Generate benchmark clients (PR base)
        working-directory: apps/benchmark
        run: pnpm generate
        env:
          DATABASE_URL: "postgresql://placeholder@localhost:5432/placeholder"

      - name: Run benchmark suite (PR base)
        working-directory: apps/benchmark
        env:
          BENCHMARK_DATASET_SIZE: ${{ env.BENCHMARK_DATASET_SIZE }}
          BENCHMARK_WARMUP_RUNS: ${{ env.BENCHMARK_WARMUP_RUNS }}
          BENCHMARK_MEASURED_RUNS: ${{ env.BENCHMARK_MEASURED_RUNS }}
          BENCHMARK_RESULT_PATH: ${{ runner.temp }}/benchmark-results/baseline.json
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
          NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
        run: pnpm benchmark:ci

      - name: Restore PR head
        run: |
          git checkout --force ${{ github.sha }}
          find . -name node_modules -type d -prune -exec rm -rf {} +
          pnpm install --frozen-lockfile

      - name: Compare benchmarks
        working-directory: apps/benchmark
        run: |
          test -f "$RUNNER_TEMP/benchmark-results/baseline.json"
          test -f "$RUNNER_TEMP/benchmark-results/current.json"
          pnpm benchmark:compare \
            --baseline "$RUNNER_TEMP/benchmark-results/baseline.json" \
            --current "$RUNNER_TEMP/benchmark-results/current.json" \
            --threshold 10 \
            --json-out "$RUNNER_TEMP/benchmark-results/report.json" \
            --markdown-out "$RUNNER_TEMP/benchmark-results/report.md"

      - name: Enforce benchmark regression gate
        run: |
          jq -r '(.notices[]? | "Notice: " + .)' "$RUNNER_TEMP/benchmark-results/report.json"
          if [ "$(jq -r '.shouldFail' "$RUNNER_TEMP/benchmark-results/report.json")" = "true" ]; then
            echo "Benchmark regression gate failed." >&2
            exit 1
          fi

      - name: Publish benchmark PR comment
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        working-directory: apps/benchmark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm benchmark:comment --body-file "$RUNNER_TEMP/benchmark-results/report.md"

      - name: Upload benchmark artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/benchmark-results/
          retention-days: 30

  publish-main-benchmark-snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browser
        working-directory: apps/benchmark
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate benchmark clients
        working-directory: apps/benchmark
        run: pnpm generate
        env:
          DATABASE_URL: "postgresql://placeholder@localhost:5432/placeholder"

      - name: Run benchmark suite
        working-directory: apps/benchmark
        env:
          BENCHMARK_DATASET_SIZE: ${{ env.BENCHMARK_DATASET_SIZE }}
          BENCHMARK_WARMUP_RUNS: ${{ env.BENCHMARK_WARMUP_RUNS }}
          BENCHMARK_MEASURED_RUNS: ${{ env.BENCHMARK_MEASURED_RUNS }}
          BENCHMARK_RESULT_PATH: ${{ runner.temp }}/benchmark-results/main-current.json
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
          NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
        run: |
          mkdir -p "$RUNNER_TEMP/benchmark-results"
          pnpm benchmark:ci

      - name: Prepare public benchmark snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/benchmark-public"
          cp "$RUNNER_TEMP/benchmark-results/main-current.json" "$RUNNER_TEMP/benchmark-public/latest.json"

      - name: Publish public benchmark snapshot
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: benchmark-data
          publish_dir: ${{ runner.temp }}/benchmark-public
          force_orphan: true
          enable_jekyll: false
          commit_message: "chore(benchmark): publish latest benchmark snapshot [skip ci]"

      - name: Upload benchmark artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results-main
          path: ${{ runner.temp }}/benchmark-results/
          retention-days: 30
