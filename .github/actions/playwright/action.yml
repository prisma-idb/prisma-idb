name: Install Playwright browsers
description: Install Playwright browsers, caching the browser binaries between runs

inputs:
  working-directory:
    description: Directory of the app that depends on @playwright/test
    required: true
  browsers:
    description: Space-separated list of browsers to install
    required: true
  with-deps:
    description: >-
      Install OS packages through apt. Chromium needs none on ubuntu-latest, so
      only enable this for browsers such as WebKit.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Get Playwright version
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    # Playwright downloads a different WebKit and Firefox build for each Ubuntu release, and
    # each build links against that release's system libraries (for example libicu). A cache
    # saved on one release breaks on another, so the cache key includes the distribution.
    - name: Get runner distribution
      id: distro
      shell: bash
      run: echo "id=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.distro.outputs.id }}-${{ steps.version.outputs.version }}-${{ inputs.browsers }}

    # Ubuntu's regional mirrors sometimes stall for minutes between packages. Without these
    # settings apt waits on a dead connection indefinitely instead of retrying it.
    - name: Make apt downloads resilient
      if: inputs.with-deps == 'true'
      shell: bash
      run: |
        sudo tee /etc/apt/apt.conf.d/80-ci-resilience > /dev/null <<'EOF'
        Acquire::Retries "5";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        DPkg::Lock::Timeout "300";
        EOF

    # System packages are not part of the browser cache, so install them on every run. This is
    # deliberately a single attempt with no `timeout` wrapper: killing `pnpm exec` leaves the
    # root `apt-get` child running and holding the dpkg lock, so a retry always fails on the lock.
    - name: Install Playwright system dependencies
      if: inputs.with-deps == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm exec playwright install-deps ${{ inputs.browsers }}

    - name: Install Playwright browsers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # The CDN download occasionally hangs on a runner; cap each attempt and retry once.
      run: |
        timeout 600 pnpm exec playwright install ${{ inputs.browsers }} \
          || timeout 600 pnpm exec playwright install ${{ inputs.browsers }}
